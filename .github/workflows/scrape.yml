name: Refresh mosque data

on:
  schedule:
    # Every hour, on the hour. GitHub may delay scheduled runs by a few
    # minutes during high load — that's expected and fine for this use case.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  # Hourly runs can occasionally overlap if a previous run is still finishing
  # (Nominatim geocoding, slow mosque sites, etc.) — queue instead of running
  # two scrapes in parallel, which could race on the same git push.
  group: scrape-mosque-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all scrapers
        run: npm run scrape:all
        # If this step fails specifically inside Puppeteer with a "missing
        # shared libraries" error, the fix is to add an `apt-get install`
        # step here for the missing libs (GitHub's ubuntu-latest runner
        # usually already has what headless Chrome needs, so this is not
        # expected to be necessary).

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/*.json; then
            echo "No changes to mosque data — skipping commit."
            exit 0
          fi
          git add src/data/*.json
          git commit -m "Refresh scraped mosque data"
          git push
