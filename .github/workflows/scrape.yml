name: Refresh mosque data

on:
  schedule:
    # Every Monday at 08:00 UTC. GitHub may delay scheduled runs by a few
    # minutes during high load — that's expected and fine for this use case.
    - cron: "0 8 * * 1"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all scrapers
        run: npm run scrape:all
        # If this step fails specifically inside Puppeteer with a "missing
        # shared libraries" error, the fix is to add an `apt-get install`
        # step here for the missing libs (GitHub's ubuntu-latest runner
        # usually already has what headless Chrome needs, so this is not
        # expected to be necessary).

      - name: Open a pull request with the refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh scraped mosque data"
          title: "Refresh scraped mosque data"
          body: |
            Automated weekly refresh from all mosque data sources (awqat.net, MAC, ICNA, BCMA, OpenStreetMap).

            Please review the diff before merging — this PR only updates `src/data/*.json`, nothing else changes.
          branch: auto/refresh-mosque-data
          delete-branch: true
          add-paths: |
            src/data/*.json
